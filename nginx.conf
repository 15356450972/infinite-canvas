server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 浏览器直连喵呜 content 会因 CORS/302 失败，同域转发并跟随跳转后落本地。
    location /__miaowu/ {
        proxy_pass https://api.miaowuai.store/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.miaowuai.store;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 20s;
        proxy_read_timeout 120s;
    }

    # 喵呜结果图在火山 TOS 上，浏览器直连无 CORS 且链接会过期。同域转发后立刻落本地/转 uguu。
    location ~ ^/__tos/(?<tos_host>[-0-9A-Za-z.]+)(?<tos_path>/.*)$ {
        if ($tos_host !~* \.(volces|volcengine)\.com$) {
            return 403;
        }
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://$tos_host$tos_path$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $tos_host;
        proxy_connect_timeout 20s;
        proxy_read_timeout 60s;
    }

    # 浏览器不能直连 uguu.se（无 CORS），由站点同域转发。
    location /__uguu/ {
        proxy_pass https://uguu.se/;
        proxy_ssl_server_name on;
        proxy_set_header Host uguu.se;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 128m;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
